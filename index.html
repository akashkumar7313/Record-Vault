<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="RecordVault - secure personal records manager">
  <meta name="theme-color" content="#7C3AED">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%238B5CF6'/%3E%3Cstop offset='.55' stop-color='%236366F1'/%3E%3Cstop offset='1' stop-color='%2322D3EE'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ctext x='32' y='42' font-family='system-ui,sans-serif' font-size='26' font-weight='800' fill='white' text-anchor='middle'%3ERV%3C/text%3E%3C/svg%3E">
  <title>RecordVault</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&family=Roboto:wght@400;500;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="app">
    <header class="appbar" id="appbar"></header>

    <main class="content" id="content">
      <div class="loader"><span class="spinner"></span></div>
    </main>

    <button class="fab" id="fab" type="button" hidden>
      <span class="material-symbols-outlined">add</span>
      <span class="fab-label">Add record</span>
    </button>

    <nav class="navbar" id="navbar">
      <button class="nav-item is-active" data-tab="dashboard" type="button">
        <span class="material-symbols-outlined">dashboard</span>
        <span>Dashboard</span>
      </button>
      <button class="nav-item" data-tab="records" type="button">
        <span class="material-symbols-outlined">folder_copy</span>
        <span>Records</span>
      </button>
      <button class="nav-item" data-tab="settings" type="button">
        <span class="material-symbols-outlined">settings</span>
        <span>Settings</span>
      </button>
    </nav>
  </div>

  <div class="snackbar-host" id="snackbarHost"></div>

  <div class="sheet-host" id="sheetHost"></div>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="app.js"></script>
</body>

</html>
